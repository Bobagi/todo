services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      db:
        condition: service_healthy

  studio:
    build: .
    # Prisma Studio = painel admin do banco. Fica DESLIGADO por padrão (2026-07-22):
    # o subdomínio studio.todo.bobagi.space foi derrubado a pedido do operador.
    # Para usar em manutenção: docker compose --profile admin up -d studio
    # e alcançar via túnel SSH -> http://127.0.0.1:5556  (nunca expor publicamente).
    profiles: ['admin']
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: [""] # <— importantíssimo: NÃO roda o docker-entrypoint.sh aqui
    command: sh -c "npx prisma generate && npx prisma studio --port 5555 --hostname 0.0.0.0 --browser none"
    ports:
      - "127.0.0.1:${PRISMA_STUDIO_PORT:-5555}:5555"

  db:
    image: postgres:14
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
